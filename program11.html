<html>
<head>
<title>Online Examination</title>
<style>
body {font-family: Arial;background: lightblue;
}
.exam {
background: white;
width: 60%;
margin: 30px auto;
padding: 20px;
border-radius: 10px;
}

h2 {
    text-align: center;
    color: blue;
}

p {
    font-weight: bold;
}

input[type="text"] {
    width: 95%;
    padding: 10px;
    margin: 8px 0 15px;
}

button {
    background: green;
    color: white;
    padding: 10px 20px;
    border: 0;
    cursor: pointer;
}

button:hover {
    background: darkgreen;
}

#result {
    color: blue;
    font-size: 20px;
}
</style>
</head>

<body>

<div class="exam">

<h2>ONLINE EXAMINATION</h2>

<!-- Student Details -->
<h3>Student Details</h3>

<label>Student Name:</label>
<input type="text" id="studentName"
placeholder="Enter your name" required>

<label>Register Number:</label>
<input type="text" id="regNo"
placeholder="Enter register number" required>

<hr>

<h3 id="timer">Time Left: 02:00</h3>

<h3>Answer the following questions:</h3>

<form id="exam">

<script>
let questions = [
["HTML stands for?",
"Hyper Text Markup Language",
"High Text Language",
"Hyper Transfer Language"],

["Which keyword is used to declare a variable?",
"var","int","float"],

["What does CSS stand for?",
"Cascading Style Sheets",
"Computer Style Sheets",
"Creative Style Sheets"],

["Which tag is used to create a paragraph in HTML?",
"<p>","<h1>","<br>"],

["Which symbol is used for comments in JavaScript?",
"//","##","**"],

["Which method displays an alert box?",
"alert()","print()","display()"],

["Which object is used for mathematical operations?",
"Math","String","Date"],

["Which event occurs when clicking a button?",
"onclick","onload","onmouseover"],

["Which function converts a string to integer?",
"parseInt()","toString()","alert()"],

["Which language makes web pages interactive?",
"JavaScript","HTML","CSS"]
];

questions.forEach((q,i) => {
    document.write(`<p>${i+1}. ${q[0]}</p>`);

    q.slice(1).forEach((a,j) => {
        let option = a.replaceAll("<","&lt;")
                      .replaceAll(">","&gt;");

        document.write(`
        <input type="radio"
        name="q${i+1}"
        value="${j==0?1:0}">
        ${option}<br>
        `);
    });
});
</script>

<br><br>

<button type="button" id="submitBtn"
onclick="check()">
Submit Exam
</button>

</form>

<h3 id="result"></h3>

<div id="studentResult"></div>

</div>

<script>

let time = 120;
let submitted = false;

let timer = setInterval(() => {

    let m = Math.floor(time/60);
    let s = time%60;

    document.getElementById("timer").innerHTML =
    "Time Left: " +
    String(m).padStart(2,'0') + ":" +
    String(s).padStart(2,'0');

    time--;

    if(time < 0) {

        clearInterval(timer);

        document.getElementById("timer").innerHTML =
        "Time Over!";

        check();

        alert("Time is over! Your exam is automatically submitted.");

    }

},1000);


function check() {

    if(submitted) return;

    let name = document.getElementById("studentName").value.trim();
    let reg = document.getElementById("regNo").value.trim();

    if(!name || !reg) {
        alert("Please enter your name and register number.");
        return;
    }

    let score = 0;

    for(let i=1;i<=10;i++) {

        let ans = document.querySelector(
        `input[name="q${i}"]:checked`);

        if(ans && ans.value=="1") {
            score++;
        }

    }

    submitted = true;

    clearInterval(timer);

    document.getElementById("result").innerHTML =
    "Your Score: " + score + "/10";

    document.getElementById("studentResult").innerHTML =
    "<h3>Examination Details</h3>" +
    "<p>Student Name: " + escapeHTML(name) + "</p>" +
    "<p>Register Number: " + escapeHTML(reg) + "</p>" +
    "<p>Final Score: " + score + "/10</p>";

    document.getElementById("submitBtn").disabled = true;

    document.querySelectorAll(
    "#exam input, #studentName, #regNo"
    ).forEach(input => input.disabled = true);

}

function escapeHTML(str) {
    return str.replace(/[&<>"']/g, function(c) {
        return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[c];
    });
}
</script>
</body>
</html>
